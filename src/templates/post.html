<article class="post page-top">
	<header class="post-header">
		<a class="label" href="/notes/">← All notes</a>
		<div class="post-meta">
			<time class="label" datetime="{{date}}">{{displayDate}}</time>
			{{tags}}
		</div>
		<h1>{{title}}</h1>
	</header>

	{{image}}

	<div class="prose">
		{{body}}
	</div>
</article>
