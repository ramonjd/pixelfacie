<!-- The heading and the robot share a dark display panel, dark in both
     themes. The robot's 12 frames take turns, 450ms each (see "Home page"
     in styles.css). The art comes from src/assets/robot.js. -->
<section class="display home-display" aria-labelledby="tagline">
	<h1 id="tagline" class="tagline">First impressions of AI law</h1>
	<svg class="home-robot" width="90" height="115" viewBox="0 0 18 23" aria-hidden="true">{{robotFrames}}</svg>
</section>

<!-- The newest note and earlier notes on the left, Topics on the right. -->
<div class="home-columns">
	<div class="home-main">
		<article class="exhibit" aria-labelledby="exhibit-title">
			{{latestNote}}
		</article>
		{{earlierNotes}}
	</div>
	{{topics}}
</div>
